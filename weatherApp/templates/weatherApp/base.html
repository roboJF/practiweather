<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Weather App{% endblock %}</title>
    {% load static %}
    {% block extra_head %}{% endblock %}
    <link rel="stylesheet" href="{% static 'style.css' %}">
</head>
<body>
    <header class="site-header">
        <a class="site-brand" href="{% url 'weatherApp:index' %}">PractiWeather</a>
        <nav class="site-nav" aria-label="Account">
            {% if user.is_authenticated %}
                <span class="account-name">{{ user.username }}</span>
                <a href="{% url 'weatherApp:saved_cities' %}">Saved cities</a>
                <form method="post" action="{% url 'weatherApp:logout' %}">
                    {% csrf_token %}
                    <button class="nav-button" type="submit">Log out</button>
                </form>
            {% else %}
                <a href="{% url 'weatherApp:login' %}">Log in</a>
                <a href="{% url 'weatherApp:sign_up' %}">Sign up</a>
            {% endif %}
        </nav>
    </header>

    <main class="weather-app">
        {% block content %}{% endblock %}
    </main>

    {% block scripts %}{% endblock %}
</body>
</html>
